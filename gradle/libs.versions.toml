[versions]
springBootVersion = "4.1.0"
springModulithVersion = "2.1.0"
jjwtVersion = "0.12.6"
archunitVersion = "1.3.0"
junitBomVersion = "6.0.0"
lombokVersion = "1.18.36"

[libraries]
# BOMs — import as `platform(...)` in modules that don't apply the Boot plugin directly
springBootDependenciesBom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBootVersion" }
springModulithBom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulithVersion" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junitBomVersion" }

# Spring Boot starters (version managed by springBootDependenciesBom / the Boot plugin)
springBootStarter = { module = "org.springframework.boot:spring-boot-starter" }
springBootStarterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springBootStarterWebmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
springBootStarterValidation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springBootStarterSecurity = { module = "org.springframework.boot:spring-boot-starter-security" }
springBootStarterDataJpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
springBootStarterFlyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test" }
springBootStarterSecurityTest = { module = "org.springframework.boot:spring-boot-starter-security-test" }
springBootStarterDataJpaTest = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }

# Spring Modulith — verify() boundary checks only, bootstrap test scope
springModulithStarterTest = { module = "org.springframework.modulith:spring-modulith-starter-test" }
springModulithDocs = { module = "org.springframework.modulith:spring-modulith-docs" }

# Plain Spring Framework modules (no Boot autoconfiguration) for gateway/infrastructure modules
springWeb = { module = "org.springframework:spring-web" }
springContext = { module = "org.springframework:spring-context" }
springTx = { module = "org.springframework:spring-tx" }

jakartaServletApi = { module = "jakarta.servlet:jakarta.servlet-api" }
jacksonDatabind = { module = "com.fasterxml.jackson.core:jackson-databind" }

flywayMysql = { module = "org.flywaydb:flyway-mysql" }
mysqlConnectorJ = { module = "com.mysql:mysql-connector-j" }
h2 = { module = "com.h2database:h2" }

jjwtApi = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwtVersion" }
jjwtImpl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwtVersion" }
jjwtJackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwtVersion" }

archunitJunit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunitVersion" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombokVersion" }

junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBootVersion" }
