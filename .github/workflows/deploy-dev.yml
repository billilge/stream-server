name: Deploy Dev

# main 푸시(또는 수동 실행) → 이미지 빌드/푸시(GHCR) → Coolify dev 재배포
on:
  push:
    branches: [main]
  # push 이벤트가 빠졌을 때 손으로 돌리는 복구 수단. 스택 PR을 비동기 머지로 넣으면 실제로 빠진다
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # dev는 main만 따라간다. 다른 ref로 돌리면 :dev 이미지가 main이 아닌 코드로 덮인다
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # dev 리소스는 :dev(이동 태그)에 고정. dev-<sha>는 추적/롤백용
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify
        run: |
          curl --fail-with-body --request POST \
            --connect-timeout 10 --max-time 60 \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_DEV_UUID }}&force=true" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            --header "Content-Length: 0"
