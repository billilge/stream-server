file:
  storage:
    s3:
      bucket: ${R2_BUCKET:}
      region: ${R2_REGION:auto}
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      upload-url-expiry-seconds: ${S3_UPLOAD_URL_EXPIRY_SECONDS:600}
# KConnect 측 요청으로 API 명세(주소·경로·응답 필드)는 환경 변수로만 주입하고 저장소에 남기지 않는다
oauth:
  kconnect:
    base-url: ${KCONNECT_BASE_URL:}
    token-path: ${KCONNECT_TOKEN_PATH:}
    client-id: ${KCONNECT_CLIENT_ID:}
    client-secret: ${KCONNECT_CLIENT_SECRET:}
    allowed-redirect-uris: ${KCONNECT_ALLOWED_REDIRECT_URIS:kmustream://oauth/kconnect}
    user-info:
      path: ${KCONNECT_USER_INFO_PATH:}
      id-field: ${KCONNECT_USER_INFO_ID_FIELD:}
      student-id-field: ${KCONNECT_USER_INFO_STUDENT_ID_FIELD:}
      name-field: ${KCONNECT_USER_INFO_NAME_FIELD:}
      major-field: ${KCONNECT_USER_INFO_MAJOR_FIELD:}
      academic-status-field: ${KCONNECT_USER_INFO_ACADEMIC_STATUS_FIELD:}
    connect-timeout: 3s
    read-timeout: 5s

push:
  type: ${PUSH_TYPE:log}
  fcm:
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

# AI 서버(stream-ai). 내부 토큰은 저장소에 남기지 않는다.
# read-timeout은 조각 하나를 기다리는 시간이다. 전체 답변 시간이 아니라 조각 사이 간격 기준으로 잡는다.
client:
  stream-ai:
    base-url: ${STREAM_AI_BASE_URL:http://localhost:8000}
    chat-path: ${STREAM_AI_CHAT_PATH:/chat}
    internal-token: ${STREAM_AI_INTERNAL_TOKEN:}
    connect-timeout: 3s
    read-timeout: 30s
