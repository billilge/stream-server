jwt:
  secret-key: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# AI 서버가 /v1/ai/**를 부를 때 싣는 X-Internal-Token. 백엔드 → AI 서버 방향과 같은 값을 쓴다.
# 비어 있으면 /v1/ai/**는 전부 401이다.
ai-server:
  internal-token: ${STREAM_AI_INTERNAL_TOKEN:}
